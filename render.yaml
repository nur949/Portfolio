services:
  - type: web
    name: portfolio-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_portfolio
    startCommand: gunicorn config.wsgi:application --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: portfolio-backend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://portfolio-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-backend-db
          property: connectionString

databases:
  - name: portfolio-backend-db
    plan: free
